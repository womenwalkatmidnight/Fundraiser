<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Women Walk at Midnight Turns Ten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Inter:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}

:root{
  --night:#000000;
  --dusk:#0e0e0e;
  --moon:#ffffff;
  --haze:#e9e9e9;
  --lamp:#ffd23f;
  --line:#2b2b2b;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --title:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --hindi:'Tiro Devanagari Hindi','Noto Serif Devanagari','Hind',serif;
  color-scheme:dark;
}
body{background:var(--night);color:#cfcfcf;font-family:var(--body);font-size:18px;line-height:1.65;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:680px;margin:0 auto}
.hl{color:var(--lamp);font-weight:600}
.hl-link{text-decoration:underline;text-decoration-color:rgba(255,210,63,.6);text-underline-offset:3px}
.hl-link:hover .hl{text-decoration:underline}
.hero video::-webkit-media-controls,.hero video::-webkit-media-controls-start-playback-button,.hero video::-webkit-media-controls-overlay-play-button,.hero video::-webkit-media-controls-panel{display:none!important;-webkit-appearance:none;opacity:0;pointer-events:none}
.hero video{pointer-events:none}
.gather{margin:0 0 28px}
.gather h2{font-family:var(--title);font-weight:400;font-size:clamp(26px,5.4vw,44px);line-height:1.1;letter-spacing:.03em;text-transform:uppercase;color:var(--lamp);margin:0 0 10px;text-wrap:balance}
.gather .g-date{font-family:var(--title);font-weight:400;font-size:clamp(20px,3.6vw,30px);line-height:1.2;color:#fff;margin:0}
.gather .g-place{font-size:clamp(17px,2.4vw,20px);letter-spacing:.16em;text-transform:uppercase;color:var(--haze);margin:6px 0 0}
.hero .since{color:#fff}
.hero .hero-ask .hi-en{color:#fff;text-shadow:0 2px 2px rgba(0,0,0,1),0 3px 6px rgba(0,0,0,1),0 0 12px rgba(0,0,0,.95),0 0 24px rgba(0,0,0,.9),0 0 44px rgba(0,0,0,.8)}
.hero .hero-ask .hi{animation:none;text-shadow:0 2px 2px rgba(0,0,0,1),0 3px 6px rgba(0,0,0,1),0 0 12px rgba(0,0,0,.95),0 0 24px rgba(0,0,0,.9),0 0 44px rgba(0,0,0,.8)}

.hero{position:relative;display:flex;align-items:flex-start;overflow:hidden;background:#000;min-height:min(84vh,680px)}
.hero .hero-media{position:absolute;inset:0;display:block}
.hero video,.hero .hero-media img{width:100%;height:100%;object-fit:cover;object-position:50% 60%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 40%,rgba(0,0,0,0) 90%,var(--night) 100%)}
.hero .wrap{position:relative;z-index:1;width:100%;padding-block:40px;box-sizing:border-box}
.name{font-family:var(--title);font-weight:400;font-size:clamp(38px,12.5vw,76px);line-height:1;letter-spacing:0;margin:0;text-transform:uppercase;color:#fff}
.name span{display:block}
.name .small{font-size:1em;font-weight:400;font-style:normal;text-transform:uppercase;letter-spacing:inherit;margin:0;color:#fff}
.name .dbr{display:none}
@media (min-width:701px){
  .hero{min-height:0;height:auto}
  .hero video,.hero .hero-media img{object-position:50% 60%}
  .hero .wrap{padding-block:48px;padding-inline:max(32px,5vw)}
  .hero{flex-direction:column;align-items:stretch}
  .hero .wrap{order:1;flex:0 0 auto;padding-bottom:28px}
  .hero .hero-media{order:2;position:relative;inset:auto;flex:0 0 auto;aspect-ratio:1.9/1;width:100%}
  .hero .hero-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
  .hero .col{max-width:none;margin:0}
  .name{font-size:clamp(48px,5.2vw,96px);line-height:1.1}
  .name span,.name .small{display:inline-block;margin-right:.28em}
  .name .dbr{display:inline}
}
.since{margin-top:18px;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--haze)}
.turn-ten{margin-top:8px;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--haze)}
html{scroll-behavior:smooth}
#give{scroll-margin-top:16px}

.ask{padding-block:56px 8px}
.ask h2{font-family:var(--title);font-weight:400;font-size:clamp(24px,4.4vw,40px);line-height:1.05;margin:0;text-wrap:balance;color:#fff}
.ask .hi{font-family:var(--hindi);font-size:clamp(30px,5.6vw,50px);line-height:1.35;color:var(--lamp);margin:8px 0 0;text-shadow:0 0 28px rgba(255,210,63,.35)}

.meter{margin-top:40px;background:var(--dusk);border:1px solid var(--line);border-radius:14px;padding:24px 22px 20px}
.figs{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px}
.raised{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,46px);line-height:1;font-variant-numeric:tabular-nums;color:#fff}
.raised small{display:block;font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--haze);margin-top:8px}
.goal{text-align:right;font-size:16px;color:var(--haze)}
.goal b{display:block;font-family:var(--display);font-size:24px;color:var(--lamp);font-variant-numeric:tabular-nums}
.track{position:relative;height:16px;border-radius:99px;background:#050505;border:1px solid var(--line);margin-top:22px}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#d99a1c,var(--lamp));box-shadow:0 0 18px rgba(255,210,63,.6)}
.fill::after{content:"";position:absolute;right:-7px;top:50%;width:14px;height:14px;transform:translateY(-50%);border-radius:50%;background:#fff8dc;box-shadow:0 0 14px 4px rgba(255,210,63,.8)}
.ticks{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--haze);font-variant-numeric:tabular-nums}
.pct{margin-top:14px;font-size:15px;color:var(--haze)}
.give{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;padding:14px 26px;min-height:48px;border-radius:99px;background:var(--lamp);color:#111;font-weight:600;font-size:17px;text-decoration:none;box-sizing:border-box}
.give:hover{background:#ffe07a}
.give:focus-visible{outline:3px solid #fff;outline-offset:3px}

.letter{padding-block:48px 24px}
.letter p{margin:0 0 1.2em;max-width:65ch}
.letter em{font-family:var(--display);font-style:italic}
.letter .cities{color:var(--haze)}
.close{padding-block:8px 72px;text-align:left}
.close .sign{font-family:var(--hindi);font-size:clamp(40px,8vw,64px);color:var(--lamp);line-height:1.3;margin:0}
.close .latin{font-family:var(--display);font-style:italic;font-size:22px;margin:4px 0 0;color:#fff}
.sec{padding-block:40px}
.sec h3{font-family:var(--title);font-weight:400;font-size:clamp(28px,5vw,38px);line-height:1.15;margin:0 0 6px;text-wrap:balance;color:#fff}
.sec .lede{color:var(--haze);margin:0 0 24px}
.days{display:grid;gap:14px}
.day{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.day:last-child{border-bottom:1px solid var(--line)}
.day .d{font-family:var(--title);font-weight:400;font-size:20px;line-height:1.2;color:var(--lamp)}
.day .d small{display:block;font-family:var(--body);font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--haze);margin-top:4px}
.day p{margin:0}
.venue{margin-top:20px;font-size:16px;color:var(--haze)}
.venue b{color:var(--lamp);font-weight:600}

.bank{background:var(--dusk);border:1px solid var(--line);border-radius:14px;padding:24px 22px}
.bank dl{margin:0;display:grid;gap:14px}
.bank dt{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--haze)}
.bank dd{margin:2px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:#fff}
.bank .after{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:16px;color:var(--haze)}
.upi{background:var(--dusk);border:1px solid var(--line);border-radius:14px;padding:24px 22px;margin-bottom:16px;display:grid;gap:14px}
.upi h4{margin:0;font-family:var(--title);font-weight:400;font-size:22px;color:#fff}
.upi label{display:grid;gap:6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--haze)}
.upi input{font:inherit;font-size:18px;letter-spacing:0;text-transform:none;padding:12px 14px;min-height:46px;border-radius:10px;border:1px solid var(--line);background:#000;color:#fff;box-sizing:border-box;width:100%}
.upi input:focus{outline:2px solid var(--lamp);outline-offset:1px}
.upi .pay{font:inherit;font-weight:700;font-size:18px;padding:14px 20px;min-height:50px;border-radius:99px;border:0;background:var(--lamp);color:#000;cursor:pointer}
.upi .pay:hover{filter:brightness(1.1)}
.upi .pay.alt{background:transparent;color:#fff;border:1px solid var(--line);font-weight:500;font-size:16px}
.upi .pay.alt:hover{border-color:var(--lamp);color:var(--lamp)}

.upi .hint{margin:0;font-size:14px;color:var(--haze)}
.copy{font:inherit;font-size:13px;padding:6px 12px;min-height:32px;border-radius:99px;border:1px solid var(--line);background:transparent;color:#fff;cursor:pointer}
.copy:hover{border-color:var(--lamp);color:var(--lamp)}
.copy:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.links{display:flex;flex-wrap:wrap;gap:12px}
.links a{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:10px 20px;border-radius:99px;border:1px solid var(--line);color:#fff;text-decoration:none;font-weight:500}
.links a:hover{border-color:var(--lamp);color:var(--lamp)}
.links a:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.links svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
@media (max-width:560px){.day{grid-template-columns:minmax(0,1fr);gap:4px}}
footer a{color:inherit;text-decoration:underline;text-underline-offset:3px}
footer a:hover{color:var(--lamp)}
footer{border-top:1px solid var(--line);padding-block:22px 34px;font-size:14px;color:var(--haze)}
@media (max-width:480px){body{font-size:17px}.goal{text-align:left}}
@media (prefers-reduced-motion:no-preference){
  .fill{transition:width 1.4s ease-out}
  .name span{animation:rise .9s ease-out both}
  .name span:nth-child(2){animation-delay:.12s}.name span:nth-child(3){animation-delay:.24s}.name span:nth-child(4){animation-delay:.36s}
  .hi{animation:glow 4s ease-in-out infinite alternate}
}
@keyframes rise{from{opacity:.25;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes glow{from{text-shadow:0 0 18px rgba(255,210,63,.25)}to{text-shadow:0 0 34px rgba(255,210,63,.55)}}

.pic{padding-block:28px 0}.pic img{width:100%;height:auto;display:block;border-radius:14px}
.givers{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.givers li{display:grid;gap:2px;padding:14px 18px;border-radius:12px;background:var(--dusk);border:1px solid var(--line);overflow-wrap:anywhere}
.givers .gn{font-family:var(--display);font-weight:700;font-size:19px;color:#fff;line-height:1.25}
.givers .gp{font-size:15px;color:var(--lamp)}
.givers .gp::before{content:"from ";color:var(--haze)}
.givers .ga{font-size:15px;color:var(--haze);font-variant-numeric:tabular-nums}
.givers li.anon .gn{font-style:italic;font-weight:500}
.nogivers{color:var(--haze);margin:0}

.admin{border:1px dashed var(--lamp);border-radius:14px;padding:22px;background:rgba(255,210,63,.05)}
.admin h3{font-size:24px}
.admin .note{font-size:14px;color:var(--haze);margin:0 0 16px}
.admin form{display:grid;gap:14px}
.admin .row{display:flex;flex-wrap:wrap;gap:14px}
.admin label{display:grid;gap:4px;font-size:14px;color:var(--haze);flex:1 1 180px;min-width:0}
.admin input[type=text],.admin input[type=number]{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#000;color:#fff;min-width:0}
.admin .check{display:flex;align-items:center;gap:8px;flex:0 1 auto;color:#fff;font-size:15px}
.admin .check input{width:18px;height:18px;accent-color:var(--lamp)}
.admin button.act{font:inherit;font-weight:600;font-size:15px;min-height:44px;padding:10px 20px;border-radius:99px;border:0;background:var(--lamp);color:#111;cursor:pointer;justify-self:start}
.admin button.act:disabled{opacity:.6;cursor:default}
.admin button:focus-visible,.admin input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.admin .msg{font-size:14px;color:var(--lamp);min-height:1.2em;margin:0}
.admin table{width:100%;border-collapse:collapse;font-size:15px}
.admin .tbl{overflow-x:auto;margin-top:18px}
.admin th,.admin td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.admin td.n{white-space:normal;min-width:120px}
.admin .rm{font:inherit;font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:#fff;cursor:pointer}
.admin .rm:hover{border-color:#e07a6a;color:#f0a093}
.admin hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.items li{margin:0}
.items b{font-weight:600;color:var(--lamp)}
.uses{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.uses li{display:grid;gap:4px;padding:16px 18px;background:var(--dusk);border:1px solid var(--line);border-radius:12px}
.uses b{font-family:var(--title);font-weight:400;font-size:19px;color:var(--lamp)}
.uses span{font-size:16px;color:var(--haze);line-height:1.5}
@media (max-width:560px){.uses{grid-template-columns:minmax(0,1fr)}}
.upi .anon{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:0;text-transform:none;color:var(--haze);cursor:pointer}
.upi .anon input{width:20px;height:20px;min-height:0;padding:0;margin:0;accent-color:var(--lamp);flex:none}
.upi input:disabled{opacity:.45;cursor:not-allowed}
.ten-of{font-family:var(--title);font-size:clamp(22px,3vw,34px);line-height:1.1;color:var(--lamp);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.ask .hi-en{font-family:var(--display);font-style:italic;font-size:clamp(20px,3vw,26px);color:#fff;margin:2px 0 0}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.slots li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:baseline}
.slots .t{font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--lamp);font-variant-numeric:tabular-nums}
.slots b{color:#fff;font-weight:600}
.caveat{margin:22px 0 0;padding:16px 18px;border-left:3px solid var(--lamp);background:var(--dusk);border-radius:0 12px 12px 0;color:var(--haze);font-size:16px}
@media (max-width:560px){.slots li{grid-template-columns:78px minmax(0,1fr);gap:10px}}
.uses li.dream{grid-column:1/-1;border-style:dashed;border-color:var(--lamp);background:transparent}
.uses li.dream span{color:#fff;font-size:18px}
.hero-ask{margin-top:22px;padding:0}
.hero-ask h2{text-shadow:0 1px 12px rgba(0,0,0,.7)}
.hero-ask .hi{margin-top:4px}
.hero-ask .hi-en{text-shadow:0 1px 10px rgba(0,0,0,.7)}
.ask:not(.hero-ask){padding-block:32px 8px}
.ask:not(.hero-ask) .meter{margin-top:0}
.slots .pn{text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--lamp)}
.slots i{color:var(--haze)}
.slots b i{color:#fff}
.slots .pn + i{display:block;margin-top:2px}
@media (min-width:701px){
  .hero{display:block;position:relative;min-height:0;height:auto;aspect-ratio:1.92/1;max-height:100vh;width:100%}
  .hero .hero-media{position:absolute;inset:0;aspect-ratio:auto;width:100%;height:100%}
  .hero .hero-media video{object-position:50% 70%}
  .hero::after{background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 38%,rgba(0,0,0,0) 60%,rgba(0,0,0,0) 88%,var(--night) 100%)}
  .hero .wrap{position:relative;z-index:1;padding-block:clamp(24px,3.5vw,48px) 0}
  .ten-of{font-size:clamp(18px,1.8vw,28px);margin-bottom:6px}
  .name{font-size:clamp(40px,4.6vw,76px)}
  .since{margin-top:12px}
  .hero-ask{margin-top:clamp(12px,1.6vw,22px)}
  .hero-ask h2{font-size:clamp(22px,2.4vw,36px)}
  .hero-ask .hi{font-size:clamp(28px,3vw,46px)}
  .hero-ask .hi-en{font-size:clamp(17px,1.5vw,22px)}
}
.letter-cont{padding-block:32px 24px}
.step{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
.step .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--lamp);color:#000;font-weight:700;font-size:17px;flex:none}
.step h4{margin:0;font-family:var(--title);font-weight:400;font-size:24px;color:#fff}
.paygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.paygrid .upi{margin-bottom:0}
.paybox h4{margin:0 0 6px;font-family:var(--title);font-weight:400;font-size:20px;color:#fff}
.paygrid .bank dd{font-size:17px}
@media (max-width:700px){.paygrid{grid-template-columns:minmax(0,1fr)}}

.hero .hero-media{background:#000}
.stats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stats li{display:grid;align-content:start;gap:2px;padding:18px 20px;background:var(--dusk);border:1px solid var(--line);border-radius:12px}
.stats .pre{font-size:15px;color:var(--haze);min-height:1.5em;line-height:1.5}
.stats b{font-family:var(--title);font-weight:400;font-size:clamp(32px,6vw,46px);line-height:1.05;color:var(--lamp);overflow-wrap:anywhere}
.stats .lab{font-size:16px;color:#fff;line-height:1.4;margin-top:4px}
@media (max-width:480px){.stats{grid-template-columns:minmax(0,1fr)}}
.voices{display:grid;gap:16px}
.voice{margin:0;padding:6px 0 6px 20px;border-left:3px solid var(--lamp)}
.voice blockquote{margin:0}
.voice blockquote p{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(19px,2.6vw,22px);line-height:1.55;color:#fff}
.voice figcaption{margin-top:10px;font-size:15px;color:var(--haze)}
.voice figcaption b{font-weight:600;color:var(--lamp)}
.voice figcaption span::before{content:", "}

.hero .ten-of,.hero .name,.hero .since,.hero-ask h2,.hero-ask .hi,.hero-ask .hi-en{text-shadow:0 1px 3px rgba(0,0,0,.5),0 2px 16px rgba(0,0,0,.4)}
.hero-ask .hi{text-shadow:0 1px 3px rgba(0,0,0,.5),0 2px 16px rgba(0,0,0,.4),0 0 28px rgba(255,210,63,.3)}
</style>
</head>
<body>
<div id="app"></div>
<script>

  {quote: "I have now been walking with Women Walk at Midnight for about four years. From a feeling of thrill, it has now become a space where I leisure, relax, and rest by doing. I am able to enjoy the city at hours that I had been denied to. It’s these simple things of having chai, eating something chatpat, singing, and walking – that seem simple but aren’t so simple, have become accessible thanks to this practice.", name: "Deeksha Anand", place: "Faridabad"},

  {quote: "Being associated with Women Walk at Midnight for the past three years has taught me to challenge the conditioning that confines women indoors after sunset. For me, these walks offer a sense of mehfooz – a rare feeling of ease and freedom in a city where marginalised bodies often negotiate fear and discomfort. More than leisure, walking at midnight is an act of resistance in the very nature of its existence.", name: "Aman Mohammadi", place: "Saharanpur"}

function inr(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }

function page(s){

  var voices = TESTIMONIALS.length ? '<section class="sec wrap" id="voices"><div class="col"><h3>In their words</h3><div class="voices">' + TESTIMONIALS.map(function(t){ return '<figure class="voice"><blockquote><p>' + esc(t.quote) + '</p></blockquote><figcaption><b>' + esc(t.name) + '</b>' + (t.place ? '<span>' + esc(t.place) + '</span>' : '') + '</figcaption></figure>'; }).join('') + '</div></div></section>' : '';

</header>

<main>
  <section class="ask wrap"><div class="col">
    <div class="gather">
      <p class="g-date">3, 4, 5 December 2026</p>
      <p class="g-place">SACAC, New Delhi</p>
    </div>

      <a class="give" href="#give">Contribute here</a>
    </div>
  </div></section>

  <section class="sec wrap" id="uses"><div class="col">
    <h3>What your contribution makes possible</h3>
    <ul class="uses">
      <li><b>Bringing walkers to Delhi</b><span>Travel and stays for chapters from other cities</span></li>
      <li><b>Performance and music</b><span>Maya Rao's performance, the cultural evenings, sound and light</span></li>
      <li><b>Food</b><span>For walkers, volunteers and guests, and some standard things for the long table</span></li>
      <li><b>The exhibition</b><span>Materials and rentals for making and lighting the exhibition</span></li>
      <li><b>Panels</b><span>Bringing partners and speakers to the panels</span></li>
      <li><b>Collective Making</b><span>Materials and facilitators</span></li>
      <li><b>Raaton Ki Baatein / Midnight Dialogues</b><span>A newspaper in the making: curating and publishing</span></li>
      <li><b>Documentation</b><span>Recording the gathering; storing, editing and publishing the material; the brochure and the website</span></li>
      <li class="dream"><b>A dream</b><span>A mural somewhere in the city</span></li>
    </ul>
    <p class="caveat">We will expand or contract our ambition based on how much we can stretch ourselves and the funds we collect. If we are unable to carry out all of our proposed plan on 3, 4 and 5 December, we will roll it out in the coming months, as part of the tenth year.</p>
  </div></section>

  <section class="letter wrap"><div class="col">
    <p>Ten years ago, on <span class="hl">4 December</span>, a group of women took a midnight walk in Delhi. They gathered in front of some metro station and walked all over central Delhi, as if it was meant only and only for them. The air was crisp. The resolve, crisper. And thus started the silsila of <a class="hl-link" href="https://www.womenwalkatmidnight.com/" target="_blank" rel="noopener"><span class="hl">Women Walk at Midnight</span></a> - a volunteer-led, non-sponsored, non-funded practice that has been bringing women and other gender minorities together on the streets of cities around the world.</p>
    <p>Who gets to be out after dark, decides who can work late, study late, or just go for a walk. Most of us have learnt, without thinking, to text when we get home, share our location, carry pepper spray. Walking together at night, we began to imagine a different reality.</p>
    <p><span class="cities">Since that first night, we have walked in Delhi, Bangalore, Chandigarh, Faridabad, Guwahati, Kolkata, Noida and Rishikesh in India; in Kathmandu and Damak in Nepal; in Cape Town and Johannesburg in South Africa; in Dublin, Fribourg, Marseille, Erlangen and Brussels in Europe; in São Paulo in Brazil; and in Chicago in the USA.</span> Every walk has been held together by care: by volunteers, and by each other's time, food and company.</p>
    <p>This December we mark <span class="hl">ten years</span>, and look forward to the next several, till every woman can walk freely in her city, village, town, neighbourhood.</p>
    <p>On <span class="hl">3, 4 and 5 December 2026</span>, we come together in <span class="hl">Delhi</span>, where it all began and from where it all continues to grow. We will gather around <span class="hl">Maya Rao's performance of <em>Walk</em></span>, from which we draw deep inspiration for our politics, and around <span class="hl">a long table</span>, where everyone brings something to share. There will be an exhibition, panels, debates, celebration and walks.</p>
  </div></section>

  <section class="sec wrap" id="numbers"><div class="col">
    <h3>Ten years of walking, in numbers</h3>
    <ul class="stats">
      <li><span class="pre">Over</span><b>200</b><span class="lab">walks</span></li>
      <li><span class="pre">Around</span><b>800</b><span class="lab">hours of walking</span></li>
      <li><span class="pre"></span><b>Thousands</b><span class="lab">of women walking</span></li>
      <li><span class="pre">On average</span><b>16.5 lakh</b><span class="lab">steps taken, and counting</span></li>
    </ul>
  </div></section>

  ${giftImg}

  <section class="letter letter-cont wrap"><div class="col">
    <p>Care has carried us this far, but it can't buy a train ticket or a room for the night, rent a light or pay for materials. So this once, for this gathering alone, <span class="hl">we are asking for funds</span>. The walks will stay as they have always been.</p>
    <p><span class="hl">No amount is too small or too big.</span> Please give whatever you can. We welcome everything. We have come this far because of a community that has gathered around this practice, and we are certain we will be able to do this event with this same community and several more allies.</p>
    <p>We are trying to raise a big amount in a short time. So if you mean to give, <span class="hl">please don't wait.</span> How much we gather decides how much of this we are able to do.</p>
    <p>You don't need to have walked with us to be part of this. If you want the streets to belong to everyone, <span class="hl">this is yours too.</span></p>
  </div></section>

  ${programmeImg}
  <section class="sec wrap" id="programme"><div class="col">
    <h3>Tentative programme</h3>
    <p class="lede">Three days at <span class="hl">SACAC, Delhi</span>, and one night of walking across the world.</p>
    <div class="days">
      <div class="day"><div class="d">Dec 3<small>Opening</small></div><div>
        <ul class="slots">
          <li><span class="t">4 PM</span><span class="w"><b>Opening of the exhibition</b></span></li>
          <li><span class="t">7 PM</span><span class="w"><b>Maya Rao performs <i>Walk</i></b>, followed by a conversation between Maya Rao and Mallika Taneja</span></li>
          <li><span class="t">Then</span><span class="w"><b>Collective Eating – long table.</b> Women who walk together eat together.</span></li>
        </ul></div></div>
      <div class="day"><div class="d">Dec 4<small>Ten years to the night</small></div><div>
        <ul class="slots">
          <li><span class="t">6 PM</span><span class="w"><b>Panel:</b> <span class="pn">Collective Making and Making Collectives</span> <i>Reflecting on the challenges, labour and joys of making in collectives, and collectives in the making.</i> 90 minutes.</span></li>
          <li><span class="t">7:30–9 PM</span><span class="w"><b>Collective Eating – long table.</b> Women who eat together walk together.</span></li>
          <li><span class="t">9:30 PM</span><span class="w"><b>Women Walk at Midnight.</b> A global call to walk, and walks in various cities.</span></li>
        </ul></div></div>
      <div class="day"><div class="d">Dec 5<small>Closing</small></div><div>
        <ul class="slots">
          <li><span class="t">4 PM</span><span class="w"><b>Panel:</b> <span class="pn">Protest Imagery</span> <i>Thinking about new and old forms and images of protest through a feminist gaze.</i></span></li>
          <li><span class="t">6 PM</span><span class="w"><b>Concluding panel:</b> to be announced</span></li>
          <li><span class="t">7 PM</span><span class="w"><b>Music and poetry of the night</b>, with the students of SACAC and guests, building on existing protest songs from various movements.</span></li>
          <li><span class="t">8:30 PM</span><span class="w"><b>Collective Eating – long table, and a DJ night.</b> Women who eat together dance together, to the songs we play on our walks.</span></li>
        </ul></div></div>
      <div class="day"><div class="d">All three days</div><div>
        <ul class="slots">
          <li><span class="t">Exhibition</span><span class="w"><b><i>Ten years of walking</i></b>, open every day until 16 December</span></li>

var UPI_ID = "drishti.chawla.2208-1@okaxis";
var APPS_URL = "https://script.google.com/macros/s/AKfycbw8F7E-eSLrJAvJFtTDdFh0bSsFhP1wYi6ns4Lwf4ju0iApUJnuaXBxwzqnMRynVLda0w/exec";
function csvRows(t){
  var rows=[],r=[],c='',q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){c+='"';i++;} else q=false; } else c+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){r.push(c);c='';}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n')i++; r.push(c);c='';rows.push(r);r=[]; }
    else c+=ch; }
  if(c||r.length){r.push(c);rows.push(r);} return rows;
}
var SHOW_AMOUNT_FOR_ALL = true; 
function showGivers(list){
  var gl = document.getElementById('givers-list');
  if(gl) gl.innerHTML = list.map(function(d){ return '<li' + (d.anon || d.name === 'Anonymous' ? ' class="anon"' : '') + '><span class="gn">' + esc(d.name) + '</span>' + (d.place ? '<span class="gp">' + esc(d.place) + '</span>' : '') + ((SHOW_AMOUNT_FOR_ALL || d.anon || d.name === 'Anonymous') && Number(d.amt) > 0 ? '<span class="ga">' + inr(Number(d.amt)) + '</span>' : '') + '</li>'; }).join('');
}
var lastRows = [];
function updateMeter(rows){
  var s = STATE;
  var extra = (s.donors || []).reduce(function(t,d){ return t + (Number(d.amount)||0); }, 0);
  var total = (Number(s.earlier)||0) + extra + rows.reduce(function(t,r){ return t + (Number(r.amt)||0); }, 0);
  var count = rows.length + (s.donors || []).length;
  var pct = Math.min(100, s.goal ? total / s.goal * 100 : 0);
  var label = Math.round(pct*10)/10;
  var a = document.getElementById('raised'); if(a) a.textContent = inr(total);
  var f = document.getElementById('fill'); if(f) f.style.width = pct + '%';
  var b = document.getElementById('bar'); if(b) b.setAttribute('aria-valuenow', total);
  var p = document.getElementById('pct');
  if(p) p.textContent = label + '% of the way there' + (count ? ' \u00b7 ' + count + (count === 1 ? ' person has' : ' people have') + ' contributed' : '');
}
function pull(base){
  if(!APPS_URL) return;
  fetch(APPS_URL, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(rows){
    var hasShow = (rows || []).some(function(r){ return r && Object.prototype.hasOwnProperty.call(r,'show'); });
    var out = (rows || []).filter(function(r){ return r && r.name && (!hasShow || r.show === true || String(r.show).toLowerCase() === 'true' || String(r.show).toLowerCase() === 'yes'); }).map(function(r){ return {name:String(r.name), place:String(r.place||''), amt:String(r.amt||'').replace(/[^0-9.]/g,'')}; });
    lastRows = out;
    showGivers(out.concat(base));
    updateMeter(out);
  }).catch(function(){});
}
function loadGivers(base){
  showGivers(base);
  pull(base);
}
function recordName(name, place, amt){
  if(!APPS_URL) return;
  try { fetch(APPS_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({name:name, place:place, amt:amt})}); } catch(e){}
}
function wire(){
  var giveBtn = document.querySelector('a.give[href="#give"]');
  if(giveBtn) giveBtn.addEventListener('click', function(ev){
    var t = document.getElementById('give');
    if(!t) return;
    ev.preventDefault();
    t.scrollIntoView({behavior:'smooth', block:'start'});
    try{ history.replaceState(null,'','#give'); }catch(e){}
  });
  var localList = ((STATE && STATE.donors) || []).filter(function(d){ return d.name && !d.anon; }).map(function(d){ return {name:d.name, place:d.place||'', amt:d.amount}; });
  loadGivers(localList);
  setInterval(function(){ if(!document.hidden) pull(localList); }, 30000);
  var bu=document.getElementById('b-upi'); if(bu) bu.textContent = UPI_ID;
  var upi = document.getElementById('upi-form');
  var msg = document.getElementById('u-msg');
  var step = document.getElementById('pay-step');
  var reg = null;
  var anonBox = document.getElementById('u-anon');
  var nameBox = document.getElementById('u-name');
  anonBox.addEventListener('change', function(){
    nameBox.disabled = anonBox.checked;
    nameBox.required = !anonBox.checked;
    if(anonBox.checked) nameBox.value = '';
  });
  if(upi) upi.addEventListener('submit', function(ev){
    ev.preventDefault();
    var anon = anonBox.checked;
    var name = anon ? 'Anonymous' : document.getElementById('u-name').value.trim();
    var place = document.getElementById('u-place').value.trim();
    var amt = Math.round(Number(document.getElementById('u-amt').value));
    if(!name || !(amt > 0)){ msg.textContent = anon ? 'Please fill in the amount you contributed.' : 'Please fill in your name and the amount you contributed.'; return; }
    recordName(name, place, amt);
    showGivers([{name:name, place:place, amt:amt, anon:anon}].concat(lastRows, localList));
    updateMeter(lastRows.concat([{amt:amt}]));
    setTimeout(function(){ pull(localList); }, 4000);
    upi.reset(); nameBox.disabled = false; nameBox.required = true;
    msg.textContent = 'Thank you' + (anon ? '' : ', ' + name) + '! Your contribution is counted' + (anon ? ' and you appear as Anonymous.' : ' and your name is on the page.');
  });
  document.querySelectorAll('.copy').forEach(function(b){
    b.addEventListener('click', function(){
      var el = document.getElementById(b.dataset.t), txt = el.textContent;
      var reset = function(){ setTimeout(function(){ b.textContent = 'Copy'; }, 1600); };
      var fallback = function(){ var sel = window.getSelection(), rg = document.createRange(); rg.selectNodeContents(el); sel.removeAllRanges(); sel.addRange(rg); b.textContent = 'Selected'; reset(); };
      try { navigator.clipboard.writeText(txt).then(function(){ b.textContent = 'Copied'; reset(); }, fallback); } catch(e){ fallback(); }
    });
  });
}
render();
